; UI font configuration for graphics applications.
; The app reads this at runtime via fs.Resolve("config", "fonts.ini").
; If loading fails or this file is missing, the internal bitmap font is used.

[ui]
enabled = true
name = inter
paragraph_size = 14
subheading_size = 15
heading_size = 18
title_size = 20
dpi = 72
hinting = full
